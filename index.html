<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Everything | Ridesh</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        cursive: ['Dancing Script', 'cursive'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top center, #2d0b27 0%, #120313 60%, #060107 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .glass-glow {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(217, 70, 239, 0.12));
            backdrop-filter: blur(25px);
            border: 1px solid rgba(244, 63, 94, 0.35);
            box-shadow: 0 0 45px rgba(244, 63, 94, 0.3);
        }

        /* Meme Pleading Overlay Text */
        .meme-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        /* Heart Loader Animation */
        .heart-loader-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pulsing-heart {
            font-size: 4rem;
            color: #f43f5e;
            animation: heartBeat 1s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.5)); }
            50% { transform: scale(1.35); filter: drop-shadow(0 0 30px rgba(244, 63, 94, 0.9)); }
        }

        /* Floating Click Heart */
        .click-heart {
            position: fixed;
            pointer-events: none;
            animation: floatAndFade 1.2s ease-out forwards;
            font-size: 24px;
            color: #fb7185;
            z-index: 9999;
        }

        @keyframes floatAndFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6) rotate(0deg); }
            50% { opacity: 0.9; transform: translate(-50%, -80px) scale(1.3) rotate(15deg); }
            100% { opacity: 0; transform: translate(-50%, -140px) scale(1.6) rotate(-15deg); }
        }

        /* Polaroid Memory Cards */
        .polaroid {
            background: #ffffff;
            padding: 10px 10px 20px 10px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }
        .polaroid:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 20;
            box-shadow: 0 20px 40px rgba(244, 63, 94, 0.4);
        }

        /* Canvas Overlay */
        #petalCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        /* Audio Equalizer */
        @keyframes pulseBar {
            0%, 100% { height: 6px; }
            50% { height: 18px; }
        }
        .animate-bar1 { animation: pulseBar 1s infinite ease-in-out; }
        .animate-bar2 { animation: pulseBar 1.2s infinite ease-in-out 0.2s; }
        .animate-bar3 { animation: pulseBar 0.8s infinite ease-in-out 0.4s; }

        @keyframes floatGentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .float-animation { animation: floatGentle 4s infinite ease-in-out; }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 35px rgba(244, 63, 94, 0.8)); }
        }
        .pulse-gift { animation: pulseGlow 3s infinite ease-in-out; }
    </style>
</head>
<body class="relative min-h-screen text-slate-100 antialiased selection:bg-rose-500 selection:text-white flex flex-col items-center justify-center p-4">

    <!-- Petals Canvas Overlay -->
    <canvas id="petalCanvas"></canvas>

    <!-- Music Player Audio -->
    <audio id="upaharAudio" src="upahar.mp3" loop preload="auto"></audio>

    <!-- Music Player Top-Right Widget -->
    <div class="fixed top-5 right-5 z-50">
        <button onclick="toggleMusic()" class="glass-card px-4 py-2.5 rounded-full flex items-center gap-3 text-sm font-medium hover:border-rose-400/50 transition-all duration-300 shadow-xl group cursor-pointer">
            <span class="w-8 h-8 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400 group-hover:bg-rose-500 group-hover:text-white transition-all">
                <i id="musicIcon" class="fas fa-music"></i>
            </span>
            <div class="flex flex-col text-left">
                <span id="musicText" class="text-xs font-semibold text-rose-200">Play "Upahar"</span>
                <span class="text-[10px] text-slate-400">Swoopna Suman</span>
            </div>
            <div id="equalizer" class="hidden flex items-end gap-0.5 h-4 ml-1">
                <span class="w-1 bg-rose-400 rounded-full animate-bar1"></span>
                <span class="w-1 bg-pink-400 rounded-full animate-bar2"></span>
                <span class="w-1 bg-rose-300 rounded-full animate-bar3"></span>
            </div>
        </button>
    </div>

    <!-- Step Indicator Progress Header -->
    <div class="fixed top-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-2 px-4 py-2 rounded-full glass-card border border-white/10 text-xs">
        <span id="stepText" class="font-semibold text-rose-300">Chapter 1 of 5</span>
        <div class="w-20 bg-slate-800 h-1.5 rounded-full overflow-hidden ml-1">
            <div id="stepProgressBar" class="bg-gradient-to-r from-rose-500 to-pink-400 h-full w-1/5 transition-all duration-500"></div>
        </div>
    </div>


    <!-- ==================== SCREEN 1: GENTLE CHECK-IN ==================== -->
    <section id="screen1" class="relative z-10 w-full max-w-lg transition-all duration-500 opacity-100 block">
        <div class="glass-card p-8 sm:p-12 rounded-3xl text-center space-y-6 border-rose-500/30 float-animation relative">
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-rose-500 via-pink-500 to-amber-300 flex items-center justify-center text-white text-3xl mx-auto shadow-lg shadow-rose-500/30">
                <i class="fas fa-heart"></i>
            </div>

            <div class="space-y-2">
                <span class="font-cursive text-2xl sm:text-3xl text-rose-300">Namaste, My Princess</span>
                <h1 class="font-serif text-3xl sm:text-4xl font-bold text-white tracking-tight">How Are You Feeling Today?</h1>
            </div>

            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                Before we begin, I just want to pause and ask about your mood:
            </p>

            <div class="space-y-3 pt-2">
                <button onclick="nextScreen(2)" class="w-full py-3.5 px-5 rounded-2xl glass-card hover:bg-rose-500/20 border-rose-500/3
